# jsscango unified rule set, v0.4.0+
#
# Schema:
#   - id:       short stable identifier (used in RuleHit.RuleID)
#     kind:     fingerprint | vuln | sensitive
#     group:    grouping label for reports (optional)
#     pattern:  RE2 regex (https://github.com/google/re2/wiki/Syntax)
#     enabled:  default true; set false to skip
#     scope:    body | header | any (advisory, currently always treated as "any")
#
# Sources:
#   - jsscango originals (framework discovery, Phase 4 extras)
#   - HaE Config.yml @ 8f363507 (2026-05-20), upstream:
#     https://github.com/gh0stkey/HaE
#     src/HaENet/src/main/resources/rules/Rules.yml
#
# To regenerate: run scripts/fetch_hae_rules.sh (see commit history).
# To override at runtime: --rules path/to/your.yaml

rules:
  - id: auth_token
    kind: sensitive
    group: Auth
    pattern: '["''\[]*[Aa]uthorization["''\]]*\s*[:=]\s*[''"]?\b(?:[Tt]oken\s+)?[a-zA-Z0-9\-_+/]{20,500}[''"]?'
  - id: basic_token
    kind: sensitive
    group: Auth
    pattern: \b[Bb]asic\s+[A-Za-z0-9+/]{18,}={0,2}\b
  - id: bearer_token
    kind: sensitive
    group: Auth
    pattern: \b[Bb]earer\s+[a-zA-Z0-9\-=._+/\\]{20,500}\b
  - id: private_key_block
    kind: sensitive
    group: Auth
    pattern: '-----\s*?BEGIN[ A-Z0-9_-]*?PRIVATE KEY\s*?-----[a-zA-Z0-9\/\n\r=+]*-----\s*?END[ A-Z0-9_-]*? PRIVATE KEY\s*?-----'
  - id: info-chinese-idcard
    kind: sensitive
    group: Basic Information
    pattern: '[^0-9]((\d{8}(0\d|10|11|12)([0-2]\d|30|31)\d{3}$)|(\d{6}(18|19|20)\d{2}(0[1-9]|10|11|12)([0-2]\d|30|31)\d{3}(\d|X|x)))[^0-9]'
  - id: info-chinese-mobile-number
    kind: sensitive
    group: Basic Information
    pattern: '[^\w]((?:(?:\+|0{0,2})86)?1(?:(?:3[\d])|(?:4[5-79])|(?:5[0-35-9])|(?:6[5-7])|(?:7[0-8])|(?:8[\d])|(?:9[189]))\d{8})[^\w]'
  - id: info-email
    kind: sensitive
    group: Basic Information
    pattern: (\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,5}\b)
  - id: info-internal-ip-address
    kind: sensitive
    group: Basic Information
    pattern: '[^0-9]((127\.0\.0\.1)|(10\.\d{1,3}\.\d{1,3}\.\d{1,3})|(172\.((1[6-9])|(2\d)|(3[01]))\.\d{1,3}\.\d{1,3})|(192\.168\.\d{1,3}\.\d{1,3}))'
  - id: info-mac-address
    kind: sensitive
    group: Basic Information
    pattern: (^([a-fA-F0-9]{2}(:[a-fA-F0-9]{2}){5})|[^a-zA-Z0-9]([a-fA-F0-9]{2}(:[a-fA-F0-9]{2}){5}))
  - id: aliyun_ak_id
    kind: sensitive
    group: Cloud Key
    pattern: \bLTAI[A-Za-z\d]{12,30}\b
  - id: aws_ak_id
    kind: sensitive
    group: Cloud Key
    pattern: '["''](?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}["'']'
  - id: firebase_url
    kind: sensitive
    group: Cloud Key
    pattern: https://[a-z0-9-]+\.firebaseio\.com\b
  - id: gcp_ak_id
    kind: sensitive
    group: Cloud Key
    pattern: \bAIza[0-9A-Za-z_\-]{35}\b
  - id: jdcloud_ak_id
    kind: sensitive
    group: Cloud Key
    pattern: \bJDC_[0-9A-Z]{25,40}\b
  - id: kingsoft_ak_id
    kind: sensitive
    group: Cloud Key
    pattern: \bAKLT[a-zA-Z0-9\-_]{16,28}\b
  - id: oss_bucket
    kind: sensitive
    group: Cloud Key
    pattern: \b[a-z0-9.\-]{3,63}\.(?:oss-(?:cn|us|ap|eu)-[a-z0-9-]+|cos\.[a-z0-9-]+|obs\.[a-z0-9-]+|s3[.-][a-z0-9-]+)\.(?:aliyuncs|myqcloud|myhuaweicloud|amazonaws)\.com\b
  - id: qcloud_ak_id
    kind: sensitive
    group: Cloud Key
    pattern: \bAKID[A-Za-z\d]{13,40}\b
  - id: qcloud_api_gateway_appkey
    kind: sensitive
    group: Cloud Key
    pattern: \bAPID[a-zA-Z0-9]{32,42}\b
  - id: volcano_ak_id
    kind: sensitive
    group: Cloud Key
    pattern: \b(?:AKLT|AKTP)[a-zA-Z0-9]{35,50}\b
  - id: actuator_endpoint
    kind: fingerprint
    group: Discovery
    pattern: '["''/]actuator(?:/[a-z0-9_-]+)?["'']'
  - id: eureka_endpoint
    kind: fingerprint
    group: Discovery
    pattern: '["''/]eureka/apps(?:/[^"''<>\s]*)?["'']'
  - id: graphql_ep
    kind: fingerprint
    group: Discovery
    pattern: (?i)["'/](?:graphql|gql|api/graphql)["']
  - id: openapi_yaml
    kind: fingerprint
    group: Discovery
    pattern: (?i)["'/]openapi\.(?:ya?ml|json)\b
  - id: rpc_scheme
    kind: fingerprint
    group: Discovery
    pattern: \b(?:grpc|grpcs|thrift|dubbo|nacos|consul|etcd)://[^\s'"<>]+
  - id: swagger_doc
    kind: fingerprint
    group: Discovery
    pattern: (?i)["'/](v[0-9]+/)?(api-docs|swagger\.json|openapi\.json|swagger/index\.html)\b
  - id: fp-druid
    kind: fingerprint
    group: Fingerprint
    pattern: (Druid Stat Index)
  - id: fp-json-web-token
    kind: sensitive
    group: Fingerprint
    pattern: (eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9._-]{10,}|eyJ[A-Za-z0-9_\/+-]{10,}\.[A-Za-z0-9._\/+-]{10,})
  - id: fp-pdf-js-viewer
    kind: fingerprint
    group: Fingerprint
    pattern: (pdf.worker)
  - id: fp-shiro
    kind: sensitive
    group: Fingerprint
    pattern: (=deleteMe|rememberMe=)
  - id: fp-swagger-ui
    kind: fingerprint
    group: Fingerprint
    pattern: ((swagger-ui.html)|(\"swagger\":)|(Swagger UI)|(swaggerUi)|(swaggerVersion))
  - id: fp-ueditor
    kind: fingerprint
    group: Fingerprint
    pattern: (ueditor\.(config|all)\.js)
  - id: fp-vite-devmode
    kind: sensitive
    group: Fingerprint
    pattern: (/\@vite/client)
  - id: vuln-debug-logic-parameters
    kind: vuln
    group: Maybe Vulnerability
    pattern: ((access=)|(adm=)|(admin=)|(alter=)|(cfg=)|(clone=)|(config=)|(create=)|(dbg=)|(debug=)|(delete=)|(disable=)|(edit=)|(enable=)|(exec=)|(execute=)|(grant=)|(load=)|(make=)|(modify=)|(rename=)|(reset=)|(root=)|(shell=)|(test=)|(toggl=))
  - id: vuln-dos-paramters
    kind: vuln
    group: Maybe Vulnerability
    pattern: ((size=)|(page=)|(num=)|(limit=)|(start=)|(end=)|(count=))
  - id: vuln-java-deserialization
    kind: vuln
    group: Maybe Vulnerability
    pattern: (javax\.faces\.ViewState)
  - id: vuln-passwd-file
    kind: sensitive
    group: Maybe Vulnerability
    pattern: (/root:/bin/bash)
  - id: vuln-upload-form
    kind: vuln
    group: Maybe Vulnerability
    pattern: (type\=\"file\")
  - id: vuln-url-as-a-value
    kind: vuln
    group: Maybe Vulnerability
    pattern: (=(https?)(://|%3a%2f%2f))
  - id: vuln-win-ini-file
    kind: sensitive
    group: Maybe Vulnerability
    pattern: (for 16-bit app)
  - id: grafana_api_key
    kind: sensitive
    group: Monitoring
    pattern: \beyJrIjoi[a-zA-Z0-9\-_+/]{50,100}={0,2}\b
  - id: grafana_cloud_token
    kind: sensitive
    group: Monitoring
    pattern: \bglc_[A-Za-z0-9\-_+/]{32,200}={0,2}\b
  - id: grafana_service_token
    kind: sensitive
    group: Monitoring
    pattern: \bglsa_[A-Za-z0-9]{32}_[A-Fa-f0-9]{8}\b
  - id: other-302-location
    kind: fingerprint
    group: Other
    pattern: 'Location: ([^\r\n]*)'
  - id: other-create-script
    kind: fingerprint
    group: Other
    pattern: (\{[^{}]*\}\s*\[[^\s]*\]\s*\+\s*"[^\s]*\.js")
  - id: other-linkfinder
    kind: sensitive
    group: Other
    pattern: (?:"|'|\`)(((?:[a-zA-Z]{1,10}://|//)[^"'/]{1,}\.[a-zA-Z]{2,}[^"']{0,})|((?:/|\.\./|\./)[^"'><,;|*()(%%$^/\\\[\]][^"'><,;|()]{1,})|([a-zA-Z0-9_\-/]{1,}/[a-zA-Z0-9_\-/]{1,}\.(?:[a-zA-Z]{1,4}|action)(?:[\?|#][^"|']{0,}|))|([a-zA-Z0-9_\-/]{1,}/[a-zA-Z0-9_\-/]{3,}(?:[\?|#][^"|']{0,}|))|([a-zA-Z0-9_\-]{1,}\.(?:\w)(?:[\?|#][^"|']{0,}|)))(?:"|'|\`)
  - id: other-oskeys
    kind: sensitive
    group: Other
    pattern: <Key>(.*?)</Key>
  - id: other-router-push
    kind: fingerprint
    group: Other
    pattern: (\$router\.push)
  - id: other-source-map
    kind: fingerprint
    group: Other
    pattern: (\.js\.map)
  - id: sec-authorization-header
    kind: sensitive
    group: Sensitive Information
    pattern: ((basic [a-z0-9=:_\+\/-]{5,100})|(bearer [a-z0-9_.=:_\+\/-]{5,100}))
  - id: sec-cloud-key
    kind: sensitive
    group: Sensitive Information
    pattern: (((access)(|-|_)(key)(|-|_)(id|secret))|(LTAI[a-z0-9]{12,20}))
  - id: sec-jdbc-connection
    kind: sensitive
    group: Sensitive Information
    pattern: (jdbc:[a-z:]+://[a-z0-9\.\-_:;=/@?,&]+)
  - id: sec-mobile-number-field
    kind: sensitive
    group: Sensitive Information
    pattern: (((|\\)(|'|")(|[\.\w]{1,32})(mobile|phone|sjh|shoujihao|concat)(|[\.\w]{1,32})(|\\)(|'|")( |)(:|[=]{1,3}|![=]{1,2}|[\)]{0,1}\.val\()( |)(|\\)('|")([^'"]+?)(|\\)('|")(|,|\)))|((|\\)('|")([^'"]+?)(|\\)('|")(|\\)(|'|")( |)(:|[=]{1,3}|![=]{1,2})( |)(|[\.\w]{1,32})(mobile|phone|sjh|shoujihao|concat)(|[\.\w]{1,32})(|\\)(|'|")))
  - id: sec-password-field
    kind: sensitive
    group: Sensitive Information
    pattern: (((|\\)(|'|")(|[\.\w]{1,32})([p](ass|wd|asswd|assword))(|[\.\w]{1,32})(|\\)(|'|")( |)(:|[=]{1,3}|![=]{1,2}|[\)]{0,1}\.val\()( |)(|\\)('|")([^'"]+?)(|\\)('|")(|,|\)))|((|\\)('|")([^'"]+?)(|\\)('|")(|\\)(|'|")( |)(:|[=]{1,3}|![=]{1,2})( |)(|[\.\w]{1,32})([p](ass|wd|asswd|assword))(|[\.\w]{1,32})(|\\)(|'|")))
  - id: sec-sensitive-field
    kind: sensitive
    group: Sensitive Information
    pattern: (((|\\)(|'|")(|[\.\w]{1,32})(key|secret|token|config|auth|access|admin|ticket)(|[\.\w]{1,32})(|\\)(|'|")( |)(:|[=]{1,3}|![=]{1,2}|[\)]{0,1}\.val\()( |)(|\\)('|")([^'"]+?)(|\\)('|")(|,|\)))|((|\\)('|")([^'"]+?)(|\\)('|")(|\\)(|'|")( |)(:|[=]{1,3}|![=]{1,2})( |)(|[\.\w]{1,32})(key|secret|token|config|auth|access|admin|ticket)(|[\.\w]{1,32})(|\\)(|'|")))
  - id: sec-user-identity
    kind: sensitive
    group: Sensitive Information
    pattern: (\b(?:(localStorage|sessionStorage)\.(setItem|getItem)|setCookie|Cookies\.set)\s*\(\s*['"](.+?)['"].*?)
  - id: sec-userinfo-in-link
    kind: sensitive
    group: Sensitive Information
    pattern: (?:"|'|\`)(((?:[a-zA-Z]{1,10}://|//)[^"'/]{1,}\.[a-zA-Z]{2,}[^"']{0,})|((?:/|\.\./|\./)[^"'><,;|*()(%%$^/\\\[\]][^"'><,;|()]{1,})|([a-zA-Z0-9_\-/]{1,}/[a-zA-Z0-9_\-/]{1,}\.(?:[a-zA-Z]{1,4}|action)(?:[\?|#][^"|']{0,}|))|([a-zA-Z0-9_\-/]{1,}/[a-zA-Z0-9_\-/]{3,}(?:[\?|#][^"|']{0,}|))|([a-zA-Z0-9_\-]{1,}\.(?:\w)(?:[\?|#][^"|']{0,}|)))(?:"|'|\`)
  - id: sec-username-field
    kind: sensitive
    group: Sensitive Information
    pattern: (((|\\)(|'|")(|[\.\w]{1,32})(([u](ser|name|sername))|(account)|((((create|update)((d|r)|(by|on|at)))|(creator))))(|[\.\w]{1,32})(|\\)(|'|")( |)(:|[=]{1,3}|![=]{1,2}|[\)]{0,1}\.val\()( |)(|\\)('|")([^'"]+?)(|\\)('|")(|,|\)))|((|\\)('|")([^'"]+?)(|\\)('|")(|\\)(|'|")( |)(:|[=]{1,3}|![=]{1,2})( |)(|[\.\w]{1,32})(([u](ser|name|sername))|(account)|((((create|update)((d|r)|(by|on|at)))|(creator))))(|[\.\w]{1,32})(|\\)(|'|")))
  - id: sec-wecom-key
    kind: sensitive
    group: Sensitive Information
    pattern: ((corp)(id|secret))
  - id: sec-windows-file-dir-path
    kind: sensitive
    group: Sensitive Information
    pattern: '[^\w]([a-zA-Z]:\\\\?(?:[^<>:/\\|?*]+\\\\?)*)([^<>:/\\|?*]+(?:\.[^<>:/\\|?*]+)?)'
  - id: github_token
    kind: sensitive
    group: Source
    pattern: \b((?:ghp|gho|ghu|ghs|ghr|github_pat)_[a-zA-Z0-9_]{36,255})\b
  - id: gitlab_v2_token
    kind: sensitive
    group: Source
    pattern: \b(glpat-[a-zA-Z0-9\-=_]{20,22})\b
  - id: mongo_uri
    kind: sensitive
    group: Source
    pattern: mongodb(?:\+srv)?://[^\s'"<>]+
  - id: mysql_uri
    kind: sensitive
    group: Source
    pattern: (?:jdbc:)?mysql://[^\s'"<>]+
  - id: redis_uri
    kind: sensitive
    group: Source
    pattern: redis://[^\s'"<>]+
  - id: vue_react_app_key
    kind: sensitive
    group: Vendor
    pattern: \b(?:VUE|APP|REACT)_[A-Z_0-9]{1,15}_(?:KEY|PASS|PASSWORD|TOKEN|APIKEY)['"]*[:=]"(?:[A-Za-z0-9_\-]{15,50}|[a-z0-9/+]{50,100}==?)"
  - id: wechat_appid
    kind: sensitive
    group: Vendor
    pattern: '["''](wx[a-z0-9]{15,18})["'']'
  - id: wechat_corpid
    kind: sensitive
    group: Vendor
    pattern: '["''](ww[a-z0-9]{15,18})["'']'
  - id: wechat_id
    kind: sensitive
    group: Vendor
    pattern: '["''](gh_[a-z0-9]{11,13})["'']'
  - id: dingtalk_webhook
    kind: sensitive
    group: Webhook
    pattern: \bhttps://oapi\.dingtalk\.com/robot/send\?access_token=[a-z0-9]{50,80}\b
  - id: feishu_webhook
    kind: sensitive
    group: Webhook
    pattern: \bhttps://open\.feishu\.cn/open-apis/bot/v2/hook/[a-z0-9\-]{25,50}\b
  - id: slack_webhook
    kind: sensitive
    group: Webhook
    pattern: \bhttps://hooks\.slack\.com/services/[a-zA-Z0-9\-_]{6,12}/[a-zA-Z0-9\-_]{6,12}/[a-zA-Z0-9\-_]{15,24}\b
  - id: wechat_webhook
    kind: sensitive
    group: Webhook
    pattern: \bhttps://qyapi\.weixin\.qq\.com/cgi-bin/webhook/send\?key=[a-zA-Z0-9\-]{25,50}\b
