# jsscango unified rule set.
#
# Schema:
#   - id:       short stable identifier (used in RuleHit.RuleID)
#     kind:     fingerprint | vuln | sensitive
#     group:    grouping label for reports (optional)
#     pattern:  RE2 regex (https://github.com/google/re2/wiki/Syntax)
#     enabled:  default true; set false to skip
#     scope:    body | header | any (advisory, currently always treated as "any")
#
# Sourced from plugins/rule.yaml (40 rules) + plugins/sensitive_data_rule.yaml (31 rules)
# in the Python codebase. Duplicates collapsed where regexes overlap.

rules:
  # ---------- Fingerprint ----------
  - id: shiro
    kind: fingerprint
    group: Fingerprint
    pattern: "(=deleteMe|rememberMe=)"
  - id: jwt_token
    kind: sensitive
    group: Auth
    pattern: 'eyJ[A-Za-z0-9_/+\-]{10,}={0,2}\.[A-Za-z0-9_/+\-\\]{15,}={0,2}\.[A-Za-z0-9_/+\-\\]{10,}={0,2}'
  - id: swagger_ui
    kind: fingerprint
    group: Fingerprint
    pattern: '((swagger-ui\.html)|("swagger":)|(Swagger UI)|(swaggerUi)|(swaggerVersion))'
  - id: ueditor
    kind: fingerprint
    group: Fingerprint
    pattern: '(ueditor\.(config|all)\.js)'
  - id: druid
    kind: fingerprint
    group: Fingerprint
    pattern: "(Druid Stat Index)"

  # ---------- Maybe Vulnerability ----------
  - id: java_deserialization
    kind: vuln
    group: Maybe Vulnerability
    pattern: '(javax\.faces\.ViewState)'
  - id: debug_logic_params
    kind: vuln
    group: Maybe Vulnerability
    pattern: '((access=)|(adm=)|(admin=)|(alter=)|(cfg=)|(clone=)|(config=)|(create=)|(dbg=)|(debug=)|(delete=)|(disable=)|(edit=)|(enable=)|(exec=)|(execute=)|(grant=)|(load=)|(make=)|(modify=)|(rename=)|(reset=)|(root=)|(shell=)|(test=)|(toggl=))'
  - id: url_as_value
    kind: vuln
    group: Maybe Vulnerability
    pattern: '(=(https?)(://|%3a%2f%2f))'
  - id: upload_form
    kind: vuln
    group: Maybe Vulnerability
    pattern: '(type=\"file\")'

  # ---------- Basic Information ----------
  - id: chinese_idcard
    kind: sensitive
    group: PII
    pattern: '\b([1-9]\d{5}(19|20)\d{2}((0[1-9])|(1[0-2]))(([0-2][1-9])|10|20|30|31)\d{3}[0-9Xx])\b'
  - id: chinese_mobile
    kind: sensitive
    group: PII
    pattern: '\b1[3-9]\d{9}\b'
  - id: internal_ip
    kind: sensitive
    group: Basic Information
    pattern: '[^0-9]((127\.0\.0\.1)|(10\.\d{1,3}\.\d{1,3}\.\d{1,3})|(172\.((1[6-9])|(2\d)|(3[01]))\.\d{1,3}\.\d{1,3})|(192\.168\.\d{1,3}\.\d{1,3}))'
  - id: mac_address
    kind: sensitive
    group: Basic Information
    pattern: '(^([a-fA-F0-9]{2}(:[a-fA-F0-9]{2}){5})|[^a-zA-Z0-9]([a-fA-F0-9]{2}(:[a-fA-F0-9]{2}){5}))'

  # ---------- Cloud / API Keys ----------
  - id: aliyun_ak_id
    kind: sensitive
    group: Cloud Key
    pattern: '\bLTAI[A-Za-z\d]{12,30}\b'
  - id: qcloud_ak_id
    kind: sensitive
    group: Cloud Key
    pattern: '\bAKID[A-Za-z\d]{13,40}\b'
  - id: jdcloud_ak_id
    kind: sensitive
    group: Cloud Key
    pattern: '\bJDC_[0-9A-Z]{25,40}\b'
  - id: aws_ak_id
    kind: sensitive
    group: Cloud Key
    pattern: '["''](?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}["'']'
  - id: volcano_ak_id
    kind: sensitive
    group: Cloud Key
    pattern: '\b(?:AKLT|AKTP)[a-zA-Z0-9]{35,50}\b'
  - id: kingsoft_ak_id
    kind: sensitive
    group: Cloud Key
    pattern: '\bAKLT[a-zA-Z0-9\-_]{16,28}\b'
  - id: gcp_ak_id
    kind: sensitive
    group: Cloud Key
    pattern: '\bAIza[0-9A-Za-z_\-]{35}\b'
  - id: qcloud_api_gateway_appkey
    kind: sensitive
    group: Cloud Key
    pattern: '\bAPID[a-zA-Z0-9]{32,42}\b'

  # ---------- Tokens / Headers ----------
  - id: bearer_token
    kind: sensitive
    group: Auth
    pattern: '\b[Bb]earer\s+[a-zA-Z0-9\-=._+/\\]{20,500}\b'
  - id: basic_token
    kind: sensitive
    group: Auth
    pattern: '\b[Bb]asic\s+[A-Za-z0-9+/]{18,}={0,2}\b'
  - id: auth_token
    kind: sensitive
    group: Auth
    pattern: '["''\[]*[Aa]uthorization["''\]]*\s*[:=]\s*[''"]?\b(?:[Tt]oken\s+)?[a-zA-Z0-9\-_+/]{20,500}[''"]?'
  - id: private_key_block
    kind: sensitive
    group: Auth
    pattern: '-----\s*?BEGIN[ A-Z0-9_-]*?PRIVATE KEY\s*?-----[a-zA-Z0-9\/\n\r=+]*-----\s*?END[ A-Z0-9_-]*? PRIVATE KEY\s*?-----'
  - id: gitlab_v2_token
    kind: sensitive
    group: Source
    pattern: '\b(glpat-[a-zA-Z0-9\-=_]{20,22})\b'
  - id: github_token
    kind: sensitive
    group: Source
    pattern: '\b((?:ghp|gho|ghu|ghs|ghr|github_pat)_[a-zA-Z0-9_]{36,255})\b'

  # ---------- Webhooks ----------
  - id: wechat_webhook
    kind: sensitive
    group: Webhook
    pattern: '\bhttps://qyapi\.weixin\.qq\.com/cgi-bin/webhook/send\?key=[a-zA-Z0-9\-]{25,50}\b'
  - id: dingtalk_webhook
    kind: sensitive
    group: Webhook
    pattern: '\bhttps://oapi\.dingtalk\.com/robot/send\?access_token=[a-z0-9]{50,80}\b'
  - id: feishu_webhook
    kind: sensitive
    group: Webhook
    pattern: '\bhttps://open\.feishu\.cn/open-apis/bot/v2/hook/[a-z0-9\-]{25,50}\b'
  - id: slack_webhook
    kind: sensitive
    group: Webhook
    pattern: '\bhttps://hooks\.slack\.com/services/[a-zA-Z0-9\-_]{6,12}/[a-zA-Z0-9\-_]{6,12}/[a-zA-Z0-9\-_]{15,24}\b'

  # ---------- IDs / App keys ----------
  - id: wechat_appid
    kind: sensitive
    group: Vendor
    pattern: '["''](wx[a-z0-9]{15,18})["'']'
  - id: wechat_corpid
    kind: sensitive
    group: Vendor
    pattern: '["''](ww[a-z0-9]{15,18})["'']'
  - id: wechat_id
    kind: sensitive
    group: Vendor
    pattern: '["''](gh_[a-z0-9]{11,13})["'']'
  - id: grafana_api_key
    kind: sensitive
    group: Monitoring
    pattern: '\beyJrIjoi[a-zA-Z0-9\-_+/]{50,100}={0,2}\b'
  - id: grafana_cloud_token
    kind: sensitive
    group: Monitoring
    pattern: '\bglc_[A-Za-z0-9\-_+/]{32,200}={0,2}\b'
  - id: grafana_service_token
    kind: sensitive
    group: Monitoring
    pattern: '\bglsa_[A-Za-z0-9]{32}_[A-Fa-f0-9]{8}\b'
  - id: vue_react_app_key
    kind: sensitive
    group: Vendor
    pattern: '\b(?:VUE|APP|REACT)_[A-Z_0-9]{1,15}_(?:KEY|PASS|PASSWORD|TOKEN|APIKEY)[''"]*[:=]"(?:[A-Za-z0-9_\-]{15,50}|[a-z0-9/+]{50,100}==?)"'

  # ---------- Generic sensitive fields ----------
  - id: password_field
    kind: sensitive
    group: Credentials
    pattern: '(?i)(?:admin_?pass|password|[a-z]{3,15}_?password|user_?pass|user_?pwd|admin_?pwd)\\?[''"]*\s*[:=]\s*\\?[''"][a-z0-9!@#$%&*]{5,20}\\?[''"]'
  - id: username_field
    kind: sensitive
    group: Credentials
    pattern: '("|'')((user|name|sername)|(account)|((((create|update)((d|r)|(by|on|at)))|(creator))))("|'')(:|=) ?("|'')(.*?)("|'')(,|$)'
  - id: wecom_key
    kind: sensitive
    group: Vendor
    pattern: '((corp)(id|secret))'
  - id: jdbc_connection
    kind: sensitive
    group: Source
    pattern: '(jdbc:[a-z:]+://[a-z0-9\.\-_:;=/@?,&]+)'
  - id: sensitive_field
    kind: sensitive
    group: Credentials
    pattern: '(\[)?(''|")?([\w]{0,10})((key)|(secret)|(token)|(config)|(auth)|(access)|(admin))([\w]{0,10})(''|")?(\])? ?(:|=) ?(''|")(.*?)(''|")(,|$)'

  # ---------- New regex scenarios (Phase 4 of plan, included earlier) ----------
  - id: swagger_doc
    kind: fingerprint
    group: Discovery
    pattern: '(?i)["''/](v[0-9]+/)?(api-docs|swagger\.json|openapi\.json|swagger/index\.html)\b'
  - id: openapi_yaml
    kind: fingerprint
    group: Discovery
    pattern: '(?i)["''/]openapi\.(?:ya?ml|json)\b'
  - id: graphql_ep
    kind: fingerprint
    group: Discovery
    pattern: '(?i)["''/](?:graphql|gql|api/graphql)["'']'
  - id: sourcemap_ref
    kind: fingerprint
    group: Discovery
    pattern: '//# sourceMappingURL=([^\s''"<>]+)'
  - id: actuator_endpoint
    kind: fingerprint
    group: Discovery
    pattern: '["''/]actuator(?:/[a-z0-9_-]+)?["'']'
  - id: eureka_endpoint
    kind: fingerprint
    group: Discovery
    pattern: '["''/]eureka/apps(?:/[^"''<>\s]*)?["'']'
  - id: oss_bucket
    kind: sensitive
    group: Cloud Key
    pattern: '\b[a-z0-9.\-]{3,63}\.(?:oss-(?:cn|us|ap|eu)-[a-z0-9-]+|cos\.[a-z0-9-]+|obs\.[a-z0-9-]+|s3[.-][a-z0-9-]+)\.(?:aliyuncs|myqcloud|myhuaweicloud|amazonaws)\.com\b'
  - id: mongo_uri
    kind: sensitive
    group: Source
    pattern: 'mongodb(?:\+srv)?://[^\s''"<>]+'
  - id: mysql_uri
    kind: sensitive
    group: Source
    pattern: '(?:jdbc:)?mysql://[^\s''"<>]+'
  - id: redis_uri
    kind: sensitive
    group: Source
    pattern: 'redis://[^\s''"<>]+'
  - id: firebase_url
    kind: sensitive
    group: Cloud Key
    pattern: 'https://[a-z0-9-]+\.firebaseio\.com\b'
  - id: rpc_scheme
    kind: fingerprint
    group: Discovery
    pattern: '\b(?:grpc|grpcs|thrift|dubbo|nacos|consul|etcd)://[^\s''"<>]+'
